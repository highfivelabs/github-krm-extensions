# A repository in an organization (github_repository). Hand-written: it is
# made on the organization (POST /orgs/{org}/repos, repos/create-in-org) and
# read, changed and deleted at /repos/{owner}/{repo} (repos/get,
# repos/update, repos/delete), which no OpenAPI path pairing finds; the
# supplement default-branch.yaml also narrows that item path to
# BranchDefault. The ID is the repository's name. Fields: the create's and
# the update's request bodies in the pinned REST description
# (github/rest-api-description 2a33d9c, descriptions/api.github.com), less
# the deprecated use_squash_pr_title_as_default; those only the create takes
# are createOnly. Topics, vulnerability alerts, Pages and the default branch
# have kinds of their own (RepositoryTopics, RepositoryVulnerabilityAlerts,
# RepositoryPagesSite, BranchDefault), as Terraform's github_repository
# makes those calls apart from the repository's own.
terraform:
- github_repository
kind: Repository
shape: crud
params:
  owner: {}
fields:
  allow_auto_merge:
    type: boolean
    description: Either `true` to allow auto-merge on pull requests, or `false` to disallow auto-merge.
  allow_forking:
    type: boolean
    description: Either `true` to allow private forks, or `false` to prevent private forks.
  allow_merge_commit:
    type: boolean
    description: Either `true` to allow merging pull requests with a merge commit, or `false` to prevent merging pull requests with merge commits.
  allow_rebase_merge:
    type: boolean
    description: Either `true` to allow rebase-merging pull requests, or `false` to prevent rebase-merging.
  allow_squash_merge:
    type: boolean
    description: Either `true` to allow squash-merging pull requests, or `false` to prevent squash-merging.
  allow_update_branch:
    type: boolean
    description: Either `true` to always allow a pull request head branch that is behind its base branch to be updated even if it is not required to be up to date before merging, or false otherwise.
  archived:
    type: boolean
    description: Whether to archive this repository. `false` will unarchive a previously archived repository.
  auto_init:
    type: boolean
    description: Pass `true` to create an initial commit with empty README.
  custom_properties:
    type: object
    description: The custom properties for the new repository. The keys are the custom property names, and the values are the corresponding custom property values.
  default_branch:
    type: string
    description: Updates the default branch for this repository.
  delete_branch_on_merge:
    type: boolean
    description: Either `true` to allow automatically deleting head branches when pull requests are merged, or `false` to prevent automatic deletion. **The authenticated user must be an organization owner to set this property to `true`.**
  description:
    type: string
    description: A short description of the repository.
  gitignore_template:
    type: string
    description: Desired language or platform [.gitignore template](https://github.com/github/gitignore) to apply. Use the name of the template without the extension. For example, "Haskell".
  has_downloads:
    type: boolean
  has_issues:
    type: boolean
    description: Either `true` to enable issues for this repository or `false` to disable them.
  has_projects:
    type: boolean
    description: Either `true` to enable projects for this repository or `false` to disable them. **Note:** If you're creating a repository in an organization that has disabled repository projects, the default is `false`, and if you pass `true`, the API returns an error.
  has_pull_requests:
    type: boolean
    description: Either `true` to allow pull requests for this repository or `false` to prevent pull requests.
  has_wiki:
    type: boolean
    description: Either `true` to enable the wiki for this repository or `false` to disable it.
  homepage:
    type: string
    description: A URL with more information about the repository.
  is_template:
    type: boolean
    description: Either `true` to make this repo available as a template repository or `false` to prevent it.
  license_template:
    type: string
    description: Choose an [open source license template](https://choosealicense.com/) that best suits your needs, and then use the [license keyword](https://docs.github.com/articles/licensing-a-repository/#searching-github-by-license-type) as the `license_template` string. For example, "mit" or "mpl-2.0".
  merge_commit_message:
    type: string
    enum:
    - PR_BODY
    - PR_TITLE
    - BLANK
  merge_commit_title:
    type: string
    enum:
    - PR_TITLE
    - MERGE_MESSAGE
  name:
    type: string
    description: The name of the repository.
  private:
    type: boolean
    description: Whether the repository is private.
  pull_request_creation_policy:
    type: string
    description: 'The policy that controls who can create pull requests for this repository: `all` or `collaborators_only`.'
    enum:
    - all
    - collaborators_only
  security_and_analysis:
    type: object
    properties:
      advanced_security:
        type: object
        properties:
          status:
            type: string
            description: Can be `enabled` or `disabled`.
      code_security:
        type: object
        description: Use the `status` property to enable or disable GitHub Code Security for this repository.
        properties:
          status:
            type: string
            description: Can be `enabled` or `disabled`.
      secret_scanning:
        type: object
        description: Use the `status` property to enable or disable secret scanning for this repository. For more information, see "[About secret scanning](/code-security/secret-security/about-secret-scanning)."
        properties:
          status:
            type: string
            description: Can be `enabled` or `disabled`.
      secret_scanning_push_protection:
        type: object
        description: Use the `status` property to enable or disable secret scanning push protection for this repository. For more information, see "[Protecting pushes with secret scanning](/code-security/secret-scanning/protecting-pushes-with-secret-scanning)."
        properties:
          status:
            type: string
            description: Can be `enabled` or `disabled`.
      secret_scanning_ai_detection:
        type: object
        description: Use the `status` property to enable or disable secret scanning AI detection for this repository. For more information, see "[Responsible detection of generic secrets with AI](https://docs.github.com/code-security/secret-scanning/using-advanced-secret-scanning-and-push-protection-features/generic-secret-detection/responsible-ai-generic-secrets)."
        properties:
          status:
            type: string
            description: Can be `enabled` or `disabled`.
      secret_scanning_non_provider_patterns:
        type: object
        description: Use the `status` property to enable or disable secret scanning non-provider patterns for this repository. For more information, see "[Supported secret scanning patterns](/code-security/secret-scanning/introduction/supported-secret-scanning-patterns#supported-secrets)."
        properties:
          status:
            type: string
            description: Can be `enabled` or `disabled`.
      secret_scanning_delegated_alert_dismissal:
        type: object
        description: Use the `status` property to enable or disable secret scanning delegated alert dismissal for this repository.
        properties:
          status:
            type: string
            description: Can be `enabled` or `disabled`.
      secret_scanning_delegated_bypass:
        type: object
        description: Use the `status` property to enable or disable secret scanning delegated bypass for this repository.
        properties:
          status:
            type: string
            description: Can be `enabled` or `disabled`.
      secret_scanning_delegated_bypass_options:
        type: object
        properties:
          reviewers:
            type: array
            items:
              type: object
              properties:
                reviewer_id:
                  type: integer
                  description: The ID of the team or role selected as a bypass reviewer
                reviewer_type:
                  type: string
                  description: The type of the bypass reviewer
                  enum:
                  - TEAM
                  - ROLE
                mode:
                  type: string
                  description: The bypass mode for the reviewer
                  enum:
                  - ALWAYS
                  - EXEMPT
  squash_merge_commit_message:
    type: string
    enum:
    - PR_BODY
    - COMMIT_MESSAGES
    - BLANK
  squash_merge_commit_title:
    type: string
    enum:
    - PR_TITLE
    - COMMIT_OR_PR_TITLE
  team_id:
    type: integer
    description: The id of the team that will be granted access to this repository. This is only valid when creating a repository in an organization.
  visibility:
    type: string
    description: The visibility of the repository.
    enum:
    - public
    - private
  web_commit_signoff_required:
    type: boolean
    description: Either `true` to require contributors to sign off on web-based commits, or `false` to not require contributors to sign off on web-based commits.
required:
- name
createOnly:
- auto_init
- custom_properties
- gitignore_template
- has_downloads
- license_template
- team_id
id: name
serverFields:
  node_id: R_example
  full_name: example-owner/example-repo
  html_url: https://github.com/example-owner/example-repo
sample:
  owner: example-owner
  name: example-repo
  description: An example repository
  visibility: private
  has_issues: true
  has_wiki: false
  delete_branch_on_merge: true
create:
  method: POST
  path: /orgs/{owner}/repos
read:
  method: GET
  path: /repos/{owner}/{id}
update:
  method: PATCH
  path: /repos/{owner}/{id}
delete:
  method: DELETE
  path: /repos/{owner}/{id}
