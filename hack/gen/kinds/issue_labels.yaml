terraform: [github_issue_labels]
kind: IssueLabelSet
shape: set
params:
  owner:
    description: The account owner of the repository. The name is not case sensitive.
  repo:
fields:
  labels:
    type: array
    items:
      type: object
      required: [name, color]
      properties:
        name: {type: string, description: The name of the label.}
        color: {type: string}
        description: {type: string, description: A short description of the label.}
required: [labels]
set: {field: labels, key: name, param: name}
sample:
  owner: example-owner
  repo: example-repo
  labels:
  - {name: bug, color: d73a4a, description: Something is not working}
  - {name: documentation, color: 0075ca}
read:
  method: GET
  path: /repos/{owner}/{repo}/labels
  query: {per_page: 100}
create:
  method: POST
  path: /repos/{owner}/{repo}/labels
update:
  method: PATCH
  path: /repos/{owner}/{repo}/labels/{name}
delete:
  method: DELETE
  path: /repos/{owner}/{repo}/labels/{name}
