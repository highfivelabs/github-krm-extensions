# A team in an organization (github_team). Hand-written, though the OpenAPI
# pairing finds it (teams/create, teams/get-by-name, teams/update-in-org,
# teams/delete-in-org): a team is named by its slug, and other kinds'
# references (TeamMembership's and TeamRepository's teamID) read its
# numeric id, which the pinned generator leaves out of the fake's server
# fields when the ID is another field. Fields: the create's and the
# update's request bodies in the pinned REST description
# (github/rest-api-description 2a33d9c); those only the create takes are
# createOnly; the parent, which reads back as an object, is written, not
# compared. Server fields: the generated kind's, and id.
terraform:
- github_team
kind: Team
shape: crud
params:
  org: {}
fields:
  description:
    type: string
    description: The description of the team.
  maintainers:
    type: array
    description: List GitHub usernames for organization members who will become team maintainers.
    items:
      type: string
  name:
    type: string
    description: The name of the team.
  notification_setting:
    type: string
    enum:
    - notifications_enabled
    - notifications_disabled
  parent_team_id:
    type: integer
    description: The ID of a team to set as the parent team.
  parent_team_slug:
    type: string
    description: The slug of a team to set as the parent team. Ignored when `parent_team_id` is also provided.
  permission:
    type: string
    description: '**Closing down notice**. The permission that new repositories will be added to the team
      with when none is specified.'
    enum:
    - pull
    - push
  privacy:
    type: string
    enum:
    - secret
    - closed
  repo_names:
    type: array
    description: The full name (e.g., "organization-name/repository-name") of repositories to add the
      team to.
    items:
      type: string
required:
- name
createOnly:
- maintainers
- repo_names
writeOnly:
- parent_team_id
- parent_team_slug
id: slug
