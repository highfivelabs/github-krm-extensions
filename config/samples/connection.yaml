apiVersion: v1
kind: Secret
metadata:
  name: github-credentials
  namespace: team-a
stringData:
  token: <token>
---
apiVersion: core.github.hfl.dev/v1alpha1
kind: Connection
metadata:
  name: default
  namespace: team-a
spec:
  baseURL: https://api.github.com
  secretRef:
    name: github-credentials
